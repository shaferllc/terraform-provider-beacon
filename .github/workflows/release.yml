# Inert inside the Beacon monorepo: GitHub only runs workflows from the repo root.
# It runs once sdks/terraform-provider-beacon is split into its own public repo
# named `terraform-provider-beacon` (Terraform Registry requirement).
#
# Required repository secrets (not configured yet):
#   GPG_PRIVATE_KEY - ASCII-armored private key whose public key is added to the Registry
#   PASSPHRASE      - passphrase for that key
#
# Release: push a tag like v0.1.0.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
